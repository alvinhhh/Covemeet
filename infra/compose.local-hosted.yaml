# Optional private portal overlay. The core remains independently runnable without it.
services:
  edge:
    environment:
      PORTAL_UPSTREAM: portal:4200
  core:
    environment:
      EDITION: hosted
  portal:
    image: covemeet-hosted:local
    build:
      context: ${HOSTED_SOURCE_DIR:?Set the private hosted repository path}
      dockerfile: Dockerfile
      target: hosted-runtime
    # Local opt-in only; this ignored file is never passed to core/media services.
    env_file:
      - path: ../runtime/local-tls/stripe-test.env
        required: false
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4200
      STATIC_DIR: /app/apps/web/dist
      SITE_ORIGIN: https://portal.localhost:8443
      CORE_PUBLIC_URL: https://meet.localhost:8443
      CORE_BASE_URL: https://meet.localhost:8443
      NODE_EXTRA_CA_CERTS: /local-trust/root.crt
      CORE_CREATION_KEY: ${CREATION_KEY:?Run local setup}
      HOSTED_ADMIN_KEY: ${HOSTED_ADMIN_KEY:?Run local setup}
      SESSION_SECRET: ${HOSTED_SESSION_SECRET:?Run local setup}
      HOSTED_DATABASE_URL: postgres://hosted:${HOSTED_POSTGRES_PASSWORD:?Run local setup}@portal-postgres:5432/hosted
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: covemeet@example.test
      TRUST_PROXY: ${CADDY_TRUSTED_IP:-}
    volumes:
      - ../runtime/local-tls/trust:/local-trust:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      core:
        condition: service_healthy
      portal-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  portal-postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: hosted
      POSTGRES_PASSWORD: ${HOSTED_POSTGRES_PASSWORD:?Run local setup}
      POSTGRES_DB: hosted
    volumes:
      - local-hosted-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hosted -d hosted"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  local-hosted-postgres-data:
