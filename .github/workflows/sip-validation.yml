name: Native SIP validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/sip-validation.yml
      - apps/phone/**
      - apps/api/**
      - scripts/sip-test*.mjs
      - scripts/ci-image-security.*
      - security/sip-image.vex.json
      - security/asterisk-image.vex.json
      - scripts/validation/sip-*
      - scripts/validation/rtc-fixture.mjs
      - infra/livekit.Dockerfile
      - infra/asterisk.Dockerfile
      - infra/asterisk/**
      - infra/compose.sip-test.yaml
      - infra/sip*.Dockerfile
      - infra/sip/**
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  native-sip:
    runs-on: ubuntu-latest
    # Bounded steps total 38 minutes, leaving 2 minutes for runner/post-step overhead.
    # A lost or forcibly killed runner can still prevent recovery and upload.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - name: SIP controller helper tests
        timeout-minutes: 1
        run: node --test --test-concurrency=1 scripts/validation/sip-client.test.mjs scripts/sip-test-support.test.mjs
      - name: Isolated native SIP validation
        id: native-validation
        timeout-minutes: 20
        run: npm run test:sip
      - name: Scoped SIP recovery
        if: always()
        timeout-minutes: 2
        run: node scripts/sip-test-recovery.mjs
      - name: Native SIP validation evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sip-validation
          path: test-results/sip/*.json
          if-no-files-found: error
      - name: Built SIP image vulnerabilities
        if: ${{ !cancelled() && steps.native-validation.outcome != 'skipped' }}
        timeout-minutes: 8
        run: bash scripts/ci-image-security.sh asterisk=covemeet-asterisk:local sip=covemeet-sip:local
      - name: SIP image security evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-sip-${{ github.sha }}
          path: security-results/images/
          retention-days: 14
          if-no-files-found: error
