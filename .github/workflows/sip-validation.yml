name: Native SIP validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sip-validation.yml
      - apps/phone/**
      - apps/api/**
      - scripts/sip-test*.mjs
      - scripts/validation/sip-*
      - scripts/validation/rtc-fixture.mjs
      - infra/asterisk.Dockerfile
      - infra/asterisk/**
      - infra/compose.sip-test.yaml
      - infra/sip*.Dockerfile
      - infra/sip/**
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  native-sip:
    runs-on: ubuntu-latest
    # Bounded steps total 29 minutes, leaving 1 minute for runner/post-step overhead.
    # A lost or forcibly killed runner can still prevent recovery and upload.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - name: SIP controller helper tests
        timeout-minutes: 1
        run: node --test --test-concurrency=1 scripts/validation/sip-client.test.mjs scripts/sip-test-support.test.mjs
      - name: Isolated native SIP validation
        timeout-minutes: 20
        run: npm run test:sip
      - name: Scoped SIP recovery
        if: always()
        timeout-minutes: 2
        run: node scripts/sip-test-recovery.mjs
      - name: Native SIP validation evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sip-validation
          path: test-results/sip/*.json
          if-no-files-found: error
