name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mail_postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_USER: mail_test
          POSTGRES_PASSWORD: ci-only-mail-test-password
          POSTGRES_DB: covemeet_mail_test
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U mail_test -d covemeet_mail_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Runtime dependency inventory and audit
        run: |
          mkdir -p security-results
          git rev-parse HEAD > security-results/commit.txt
          sha256sum package-lock.json > security-results/package-lock.sha256
          npm sbom --package-lock-only --omit=dev --sbom-format=cyclonedx --sbom-type=application > security-results/sbom.cdx.json
          npm audit --package-lock-only --omit=dev --audit-level=moderate --json > security-results/audit.json
      - name: Dependency security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-${{ github.sha }}
          path: |
            security-results/commit.txt
            security-results/package-lock.sha256
            security-results/sbom.cdx.json
            security-results/audit.json
          retention-days: 14
          if-no-files-found: error
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Shared email budget concurrency and restart
        run: node --import tsx --test packages/mail/test/budget-postgres.integration.test.ts
        env:
          MAIL_TEST_DATABASE_URL: postgres://mail_test:ci-only-mail-test-password@127.0.0.1:5432/covemeet_mail_test
      - name: Local network and relay validation helpers
        run: node --test scripts/local-network-test.test.mjs scripts/validation/browser-turn.test.mjs scripts/ci-image-security.test.mjs
      - run: npm run build
      - name: PostgreSQL certificate validation and plaintext refusal
        run: node scripts/database-tls-test.mjs
      - name: Delayed media cleanup regression
        id: media-generation
        timeout-minutes: 10
        run: |
          docker pull postgres:17.11-alpine3.23
          docker pull livekit/livekit-server:v1.13.7
          docker build -t covemeet-core:generation-test .
          MEDIA_GENERATION_IMAGE="$(docker image inspect covemeet-core:generation-test --format '{{.Id}}')" \
            node scripts/media-generation-test.mjs --execute-reviewed-fixture
      - name: Media cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-generation-validation
          path: test-results/media-generation/*.json
          if-no-files-found: ignore
      - name: Isolated phone admission and audio relay
        run: node scripts/phone-test.mjs
      - name: Phone validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-validation
          path: test-results/phone/*.json
          if-no-files-found: ignore
      - name: Built core image vulnerabilities
        if: ${{ !cancelled() && steps.media-generation.outcome != 'skipped' }}
        timeout-minutes: 8
        run: bash scripts/ci-image-security.sh core=covemeet-core:generation-test
      - name: Core image security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-core-${{ github.sha }}
          path: security-results/images/
          retention-days: 14
          if-no-files-found: error
