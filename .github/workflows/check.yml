name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Isolated phone admission and audio relay
        run: node scripts/phone-test.mjs
      - name: Phone validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-validation
          path: test-results/phone/*.json
          if-no-files-found: ignore
