name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Local network and relay validation helpers
        run: node --test scripts/local-network-test.test.mjs scripts/validation/browser-turn.test.mjs
      - run: npm run build
      - name: Delayed media cleanup regression
        timeout-minutes: 10
        run: |
          docker pull postgres:17.11-alpine3.23
          docker pull livekit/livekit-server:v1.13.7
          docker build -t covemeet-core:generation-test .
          MEDIA_GENERATION_IMAGE="$(docker image inspect covemeet-core:generation-test --format '{{.Id}}')" \
            node scripts/media-generation-test.mjs --execute-reviewed-fixture
      - name: Media cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-generation-validation
          path: test-results/media-generation/*.json
          if-no-files-found: ignore
      - name: Isolated phone admission and audio relay
        run: node scripts/phone-test.mjs
      - name: Phone validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-validation
          path: test-results/phone/*.json
          if-no-files-found: ignore
